<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>顔面偏差値診断</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      position: relative;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #a5b4fc;
      margin-bottom: 20px;
    }
    #name-section {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    #nameInput {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      outline: none;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #nameInput::placeholder { color: #94a3b8; }
    #nameInput:focus { border-color: #a78bfa; }
    #startWithNameBtn {
      background: #22c55e;
      color: #fff;
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
    }
    #video-container {
      position: relative;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 3/4;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      border: 3px solid rgba(255,255,255,0.15);
      display: none;
    }
    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    canvas { display: none; }
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-guide {
      width: 70%;
      height: 75%;
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 50% 50% 45% 45%;
      opacity: 0.7;
    }
    #controls {
      margin-top: 18px;
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 13px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
    }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #22c55e; color: #fff; }
    #captureBtn { background: #3b82f6; color: #fff; }
    #switchBtn { background: #64748b; color: #fff; }
    #retakeBtn { background: #64748b; color: #fff; display: none; }
    #status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #c7d2fe;
      text-align: center;
      min-height: 1.4em;
    }
    #result {
      display: none;
      width: 100%;
      max-width: 360px;
      margin-top: 8px;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 24px 20px;
      border: 1px solid rgba(255,255,255,0.12);
      text-align: center;
    }
    .user-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fef08a;
      margin-bottom: 8px;
    }
    .score-label {
      font-size: 0.9rem;
      color: #a5b4fc;
      margin-bottom: 4px;
    }
    .score-value {
      font-size: 3.8rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #fbbf24, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .score-rank {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 8px 0 16px;
      color: #fef08a;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 16px 0;
      text-align: left;
    }
    .metric {
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .metric-name {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .metric-bar {
      height: 6px;
      background: rgba(255,255,255,0.15);
      border-radius: 3px;
      overflow: hidden;
    }
    .metric-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      transition: width 1s ease;
    }
    .metric-score {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 3px;
    }
    .comment {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #e0e7ff;
      margin-top: 12px;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
    }
    .result-photo {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 16px;
      border: 2px solid rgba(255,255,255,0.15);
    }
    #analyzing {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,12,41,0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .analyzing-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e7ff;
    }
    .analyzing-sub {
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>顔面偏差値診断</h1>
  <p class="subtitle">あなたの顔をAIが偏差値で診断します</p>

  <div id="name-section">
    <input type="text" id="nameInput" placeholder="あなたの名前を入力" maxlength="20" autocomplete="off">
    <button id="startWithNameBtn">診断を始める</button>
  </div>

  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <div class="face-guide" id="faceGuide"></div>
    </div>
  </div>

  <div id="controls">
    <button id="startBtn">カメラ起動</button>
    <button id="captureBtn" disabled>診断する</button>
    <button id="switchBtn" disabled>切替</button>
    <button id="retakeBtn">もう一度</button>
  </div>

  <p id="status"></p>

  <div id="result">
    <div class="result-card">
      <img id="resultPhoto" class="result-photo" alt="撮影写真" style="display:none;">
      <div class="user-name" id="resultName"></div>
      <div class="score-label">顔面偏差値</div>
      <div class="score-value" id="scoreValue">--</div>
      <div class="score-rank" id="scoreRank"></div>
      <div class="metrics" id="metrics"></div>
      <div class="comment" id="comment"></div>
      
      <div id="prefecture-section" style="display:none; margin-top:24px; padding:16px; background:rgba(139,92,246,0.15); border-radius:16px;">
        <p style="margin-bottom:8px; font-size:1.1rem; font-weight:600;">🏆県内ランキング</p>
        <p style="margin-bottom:14px; color:#c4b5fd; font-size:0.9rem;">あなたの県で何位か調べる</p>
        <button id="checkRankingBtn" style="background:#8b5cf6; color:#fff; width:100%; padding:13px; font-size:1.05rem; border-radius:50px; font-weight:600; border:none;">順位を見る</button>
        <p id="rankingResult" style="margin-top:14px; font-size:1.3rem; font-weight:700; color:#fef08a;"></p>
        <button id="rediagnoseBtn" style="display:none; background:#22c55e; color:#fff; width:100%; padding:13px; font-size:1.05rem; border-radius:50px; font-weight:600; border:none; margin-top:12px;">もう一度診断</button>
      </div>
    </div>
  </div>

  <div id="analyzing">
    <div class="spinner"></div>
    <div class="analyzing-text">顔を分析中...</div>
    <div class="analyzing-sub" id="analyzingSub">輪郭を検出しています</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
